[package]
name = "hudr2"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High-density developer telemetry HUD and status sidebar for Herdr and OpenCode in native Rust"

[dependencies]
# Terminal
crossterm = "0.28"
unicode-width = "0.2"

# Asincronía y Concurrencia
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Bases de Datos SQLite (Lectura directa sin overhead)
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialización / Formatos
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Peticiones HTTP y Red (Cuotas y APIs)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilidades de Sistema y Tiempo
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6.0"
notify = "8"

[dev-dependencies]
tempfile = "3.17"
tokio = { version = "1.43", features = ["net", "io-util"] }
